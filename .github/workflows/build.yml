name: Build Sojib Tv APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d $HOME
          echo "$HOME/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Find project directory and build
        run: |
          if [ -f "SojibTv/build.gradle" ]; then
            cd SojibTv
          fi
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK files
        run: find . -name "*.apk" 2>/dev/null

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SojibTv-APK
          path: |
            **/outputs/apk/**/*.apk
          if-no-files-found: warn
