name: Build Sojib Tv APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d $HOME
          echo "$HOME/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          gradle --version
          gradle assembleDebug --no-daemon --info 2>&1 | tail -80

      - name: Find and Upload APK
        run: |
          find . -name "*.apk" -type f
          APK=$(find . -name "*.apk" -type f | head -1)
          echo "APK=$APK" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0 --yes 2>/dev/null || true
          gh release create v1.0 "$APK"             --title "Sojib Tv v1.0"             --notes "Sojib Tv App - WebView APK"
          echo "🎉 APK uploaded to Release!"
